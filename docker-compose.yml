# sitecms: движок, Postgres и Caddy с https. Кладётся в /opt/sitecms скриптом
# install.sh, рядом — .env (домен, пароль базы) и Caddyfile.
#
#   docker compose up -d                     # запустить
#   docker compose pull && docker compose up -d   # обновить
#   docker compose logs -f engine            # лог движка (пароль владельца при первом старте)
services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: sitecms
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sitecms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitecms"]
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    image: ghcr.io/sitecms/engine:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SITECMS_DSN: postgres://sitecms:${DB_PASSWORD}@db:5432/sitecms?sslmode=disable
      SITECMS_PLUGINS: /app/plugins
      SITECMS_FILES: /app/files
      SITECMS_SECURE: "1"
    volumes:
      # Плагины лежат снаружи: по подпапке на плагин, «Перечитать» в админке.
      - ./plugins:/app/plugins
      # Картинки, пока в настройках магазина не заданы ключи S3. С S3 папка
      # остаётся пустой, и бэкапом магазина становится один дамп базы.
      - ./files:/app/files

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITECMS_HOST: ${SITECMS_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
